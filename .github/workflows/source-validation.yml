# 테스트와 fixture는 로컬에 유지하며 CI에서는 실행하지 않는다.
# 작성자: 김진우
name: 소스 구성 검증

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 컴파일·타입 스키마·문법·패키징
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 자바스크립트 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 실행 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: Git 파일만으로 소스 검증 및 압축 패키지 생성
        run: python scripts/ci/validate_source.py
