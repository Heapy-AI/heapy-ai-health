<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7b68e8" />
    <meta name="description" content="HEAPY 건강정보 AI 사용자 시연 서비스" />
    <title>HEAPY | 건강정보 AI</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260811-5" />
  </head>
  <body>
    <!-- 작성자: 김진우 -->
    <main id="authScreen" class="auth-screen" aria-labelledby="loginTitle">
      <section class="auth-card">
        <span class="brand-mark auth-logo" aria-hidden="true"><img src="/images/heapy-logo.png" alt="" /></span>
        <span class="welcome-kicker">YOUR HEALTH COMPANION</span>
        <h1 id="loginTitle">다시 만나서 반가워요</h1>
        <p id="authDescription">HEAPY 계정으로 로그인해 주세요.</p>
        <div class="auth-mode-tabs" role="tablist" aria-label="인증 방식">
          <button id="loginModeButton" class="active" type="button" role="tab">로그인</button>
          <button id="signupModeButton" type="button" role="tab">회원가입</button>
        </div>
        <form id="loginForm" class="login-form">
          <label for="emailInput">이메일</label>
          <input id="emailInput" type="email" autocomplete="email" required />
          <label for="passwordInput">비밀번호</label>
          <input id="passwordInput" type="password" autocomplete="current-password" minlength="8" required />
          <div id="signupFields" class="signup-fields" hidden>
            <label for="nameInput">이름</label>
            <input id="nameInput" type="text" autocomplete="name" maxlength="50" />
            <label for="birthDateInput">생년월일</label>
            <input id="birthDateInput" type="date" />
            <label for="sexInput">성별</label>
            <select id="sexInput"><option value="">선택해 주세요</option><option value="Female">여성</option><option value="Male">남성</option></select>
          </div>
          <p id="loginError" class="login-error" role="alert" hidden></p>
          <button id="loginButton" class="login-button" type="submit">로그인</button>
        </form>
      </section>
    </main>

    <div id="appShell" class="app-shell" hidden>
      <aside class="sidebar" aria-label="대화 세션">
        <a class="brand" href="/" aria-label="HEAPY 홈">
          <span class="brand-mark" aria-hidden="true">
            <img src="/images/heapy-logo.png" alt="" />
          </span>
          <span>HEAPY</span>
        </a>

        <section class="conversation-history" aria-label="대화 기록">
          <div class="conversation-history-header">
            <span class="menu-label">CONVERSATIONS</span>
            <button id="newConversationButton" type="button">새 대화</button>
          </div>
          <div id="conversationList" class="conversation-list">
            <p class="conversation-list-empty">저장된 대화가 없습니다.</p>
          </div>
        </section>

        <div class="sidebar-footer">
          <div id="userAvatar" class="avatar">사</div>
          <div><strong id="userName">사용자</strong><span id="userEmail">로그인 계정</span></div>
          <button id="logoutButton" class="logout-button" type="button">로그아웃</button>
        </div>
      </aside>

      <main id="chat" class="chat-area">
        <header class="topbar">
          <a class="mobile-brand" href="/" aria-label="HEAPY 홈">
            <span class="brand-mark mini" aria-hidden="true"><img src="/images/heapy-logo.png" alt="" /></span>
            <strong>HEAPY</strong>
          </a>
          <div class="chat-title">
            <div class="ai-avatar">
              <img src="/images/heapy-doctor.png" alt="" aria-hidden="true" />
            </div>
            <div><h1>HEAPY 건강 AI</h1><p><span class="status-dot online"></span> 상담 가능</p></div>
          </div>
          <button id="resetButton" class="reset-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5" /></svg>
            <span>새 대화</span>
          </button>
        </header>

        <section id="conversation" class="conversation" aria-live="polite">
          <div id="welcome" class="welcome-state">
            <div class="welcome-icon">
              <img src="/images/heapy-doctor.png" alt="HEAPY AI 의사 캐릭터" />
            </div>
            <span class="welcome-kicker">YOUR HEALTH COMPANION</span>
            <h2>오늘은 어떤 건강 정보가<br />궁금하신가요?</h2>
            <p>신뢰할 수 있는 공공 건강정보를 바탕으로<br class="mobile-break" /> 쉽고 차분하게 알려드릴게요.</p>

            <div class="suggestion-grid" aria-label="추천 질문">
              <button class="suggestion-card" type="button" data-question="공복혈당 정상 수치는 어떻게 되나요?">
                <span class="suggestion-icon mint">♥</span>
                <span><strong>검진 결과 이해하기</strong><small>공복혈당 정상 수치는 어떻게 되나요?</small></span>
                <span class="arrow" aria-hidden="true">›</span>
              </button>
              <button class="suggestion-card" type="button" data-question="고혈압을 예방하는 생활 습관을 알려주세요.">
                <span class="suggestion-icon blue">♧</span>
                <span><strong>건강 습관 알아보기</strong><small>고혈압 예방에 좋은 습관이 궁금해요.</small></span>
                <span class="arrow" aria-hidden="true">›</span>
              </button>
              <button class="suggestion-card" type="button" data-question="감기의 대표적인 원인과 증상을 알려주세요.">
                <span class="suggestion-icon sand">✦</span>
                <span><strong>질환 정보 찾아보기</strong><small>감기의 원인과 대표 증상을 알려주세요.</small></span>
                <span class="arrow" aria-hidden="true">›</span>
              </button>
              <button class="suggestion-card" type="button" data-question="AST 수치가 높으면 일반적으로 무엇을 확인하나요?">
                <span class="suggestion-icon lavender">＋</span>
                <span><strong>검사 항목 알아보기</strong><small>AST 수치가 높을 때 무엇을 확인하나요?</small></span>
                <span class="arrow" aria-hidden="true">›</span>
              </button>
            </div>
          </div>
          <div id="messages" class="messages" hidden></div>
          <div id="conversationLoading" class="conversation-loading" role="status" hidden>
            <span class="session-loading-spinner" aria-hidden="true"></span>
            <strong>대화를 불러오는 중이에요</strong>
            <span>잠시만 기다려 주세요.</span>
          </div>
        </section>

        <footer class="composer-wrap">
          <form id="chatForm" class="composer">
            <label class="sr-only" for="questionInput">건강 질문 입력</label>
            <textarea id="questionInput" rows="1" maxlength="1000" placeholder="건강에 대해 무엇이든 물어보세요" required></textarea>
            <button id="sendButton" class="send-button" type="submit" aria-label="질문 보내기" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z" /><path d="M22 2 11 13" /></svg>
            </button>
          </form>
          <p class="disclaimer">HEAPY는 건강정보 제공을 위한 서비스이며 의료진의 진단을 대신하지 않습니다.</p>
        </footer>
      </main>
    </div>
    <script src="/assets/app.js?v=20260811-5" defer></script>
  </body>
</html>
